---
name: fcupcntr-dev

services:
  app:
    build:
      context: ../..
      dockerfile: build/dev/Containerfile
    init: true
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      DSN: "${DSN:-/data/counters.db}"
    volumes:
      - ../..:/opt/app
      - data:/data
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go/cache

volumes:
  data:
  go-mod-cache:
  go-build-cache:
