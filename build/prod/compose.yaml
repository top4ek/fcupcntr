---
name: fcupcntr-prod

services:
  app:
    image: "${IMAGE:-fcupcntr:prod}"
    build:
      context: ../..
      dockerfile: build/prod/Containerfile
    init: true
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8081}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      DSN: "${DSN:-/data/counters.db}"
    volumes:
      - data:/data

volumes:
  data:
